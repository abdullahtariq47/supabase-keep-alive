name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 * * 1,4'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets and ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Error: Secrets SUPABASE_URL and SUPABASE_ANON_KEY are missing."
            exit 1
          fi
          
          echo "Pinging Supabase to keep it active..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
            
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Ping successful! Supabase project is active."
          else
            echo "Ping failed with status $HTTP_STATUS."
            echo "Here is the exact error from Supabase:"
            curl -s -X GET "${SUPABASE_URL}/rest/v1/" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
            echo ""
            exit 1
          fi
